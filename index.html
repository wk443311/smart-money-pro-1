<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বিজ্ঞাপন দেখুন</title>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center; padding: 20px;
      background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
      color: #333; min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    #ad-counter {
      font-size: 1.3rem; font-weight: 700; margin-bottom: 24px;
      padding: 10px 20px; background: rgba(255,255,255,0.95);
      border-radius: 25px; display: inline-block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2); color: #555;
    }
    .ad-container {
      background: #fff; padding: 40px 32px; border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      max-width: 450px; width: 100%; animation: slideUp 0.4s ease;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .ad-container h2 { font-size: 1.8rem; margin-bottom: 16px; color: #2d3748; }
    .ad-container p { color: #718096; margin-bottom: 24px; line-height: 1.5; }
    .btn {
      padding: 14px 28px; margin: 10px 5px; cursor: pointer; border: none;
      border-radius: 10px; font-size: 1rem; font-weight: 600;
      transition: all 0.2s; width: 100%; max-width: 300px;
    }
    .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
    .btn-primary { background: linear-gradient(135deg, #fa709a, #fee140); color: white; }
    .hidden { display: none !important; }
    #ad-status { margin-top: 16px; font-weight: 500; min-height: 24px; padding: 8px 12px; border-radius: 8px; }
    .error { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
    
    .warning-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); z-index: 9999; align-items: center; justify-content: center;
    }
    .warning-modal.show { display: flex; }
    .warning-content {
      background: #fff; padding: 32px 24px; border-radius: 16px;
      max-width: 400px; width: 90%; text-align: center;
    }
    .warning-btn {
      background: linear-gradient(135deg, #fa709a, #fee140); color: white;
      border: none; padding: 12px 32px; border-radius: 10px; font-weight: 600; cursor: pointer;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="ad-counter">ads watching 5/4</div>

  <div class="warning-modal" id="warningModal">
    <div class="warning-content">
      <div style="font-size: 3rem; margin-bottom: 16px;">⚠️</div>
      <div style="font-size: 1.3rem; font-weight: 700; color: #c53030; margin-bottom: 12px;">সতর্কতা</div>
      <div id="warningMessage"></div>
      <button class="warning-btn" onclick="closeWarning()">ঠিক আছে</button>
    </div>
  </div>

  <div class="ad-container" id="ad-wall">
    <h2>🔒 কন্টেন্ট লক করা আছে!</h2>
    <p>এই কন্টেন্ট আনলক করতে নিচের বিজ্ঞাপনটি দেখুন।</p>

    <button class="btn btn-primary" id="watch-ad-btn">🔓 আনলক করতে বিজ্ঞাপন দেখুন</button>
    
    <div id="loading-ad" class="hidden">
      <div style="margin: 20px 0;">
        <div style="width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #fa709a; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
      </div>
      বিজ্ঞাপন লোড হচ্ছে...
    </div>
    
    <div id="ad-status"></div>
  </div>

  <script>
    const BLOCK_ID = "int-32886";
    const NEXT_PAGE = "https://t.me/hot_exposedlink_jshuduEBssd_bot/app"; 
    const MIN_WATCH_SEC = 8; 

    const watchAdBtn = document.getElementById('watch-ad-btn');
    const loadingAd = document.getElementById('loading-ad');
    const adStatus = document.getElementById('ad-status');
    const warningModal = document.getElementById('warningModal');
    const warningMessage = document.getElementById('warningMessage');

    function triggerAdWarning(message) {
      adStatus.textContent = message;
      adStatus.className = 'error';
      warningMessage.textContent = message;
      warningModal.classList.add('show');
    }

    function closeWarning() {
      warningModal.classList.remove('show');
      watchAdBtn.classList.remove('hidden');
      loadingAd.classList.add('hidden');
    }

    function showAdsGramAd(isAuto = false) {
      if (typeof window.Adsgram === 'undefined') return;

      const AdController = window.Adsgram.init({ blockId: BLOCK_ID });
      
      if (!isAuto) {
        watchAdBtn.classList.add('hidden');
        loadingAd.classList.remove('hidden');
        adStatus.textContent = '';
        adStatus.className = '';
      }

      const adStartTime = Date.now();

      AdController.show()
        .then(() => {
          const watchDuration = (Date.now() - adStartTime) / 1000;
          if (watchDuration >= MIN_WATCH_SEC) {
            window.location.href = NEXT_PAGE;
          } else if (!isAuto) {
            loadingAd.classList.add('hidden');
            watchAdBtn.classList.remove('hidden');
            triggerAdWarning(`⚠️ অন্তত ${MIN_WATCH_SEC} সেকেন্ড বিজ্ঞাপন দেখুন।`);
          }
        })
        .catch(() => {
          if (!isAuto) {
            loadingAd.classList.add('hidden');
            watchAdBtn.classList.remove('hidden');
            triggerAdWarning("বিজ্ঞাপন লোড হয়নি। আবার চেষ্টা করুন।");
          }
        });
    }

    watchAdBtn.addEventListener('click', () => showAdsGramAd(false));

    window.addEventListener('load', () => {
      showAdsGramAd(true); 
    });
  </script>

</body>
</html>
