    <style>
        /* ===== NEW DESIGN: NEO-BRUTALIST / VAPORWAVE EDGE ===== */
        * {

        .premium-header {
            text-align: left;

            border-bottom: 6px solid #1a1a1a;

        .premium-header h1 {

            padding: 8px 16px 8px 12px;
            border: 4px solid #1a1a1a;
            box-shadow: 6px 6px 0 #1a1a1a;

            margin-bottom: 10px;
        }

        .premium-header p {
            color: #1a1a1a;
            font-size: 14px;
            margin-top: 8px;
            font-weight: 700;
            background: #b8e0d2;
            display: inline-block;
            padding: 6px 18px;
            border: 3px solid #1a1a1a;
            box-shadow: 4px 4px 0 #1a1a1a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 0;
        }

        /* Video Grid — spacing */
        .video-grid {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* Video Card — brutalist box */
        .video-card {
            background: #ffffff;
            border: 4px solid #1a1a1a;
            border-radius: 0;
            overflow: hidden;
            box-shadow: 10px 10px 0 #1a1a1a;
            transition: all 0.1s ease;
            cursor: pointer;
            position: relative;
        }

        .video-card:active {
            transform: translate(4px, 4px);
            box-shadow: 6px 6px 0 #1a1a1a;
        }

        /* Thumbnail */
        .thumbnail-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #1a1a1a;
            overflow: hidden;
            border-bottom: 4px solid #1a1a1a;
        }

        .thumbnail-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(20%) contrast(1.1);
            transition: filter 0.2s;
        }

        .video-card:hover .thumbnail-wrapper img {
            filter: grayscale(0%) contrast(1.05);
        }

        /* Play Overlay — geometric */
        .play-icon-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
            mix-blend-mode: normal;
        }

        .play-icon-overlay:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .play-icon-overlay svg {
            width: 80px;
            height: 80px;
            filter: drop-shadow(4px 4px 0 #1a1a1a);
            transition: transform 0.15s ease;
        }

        .video-card:hover .play-icon-overlay svg {
            transform: scale(1.08) rotate(-2deg);
        }

        /* Footer */
        .video-card-footer {
            padding: 16px 16px 16px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: #fff9e6;
            border-top: none;
        }

        .video-title {
            font-weight: 800;
            font-size: 17px;
            color: #1a1a1a;
            letter-spacing: -0.3px;
            text-transform: uppercase;
            background: #ffd93d;
            padding: 4px 12px;
            border: 3px solid #1a1a1a;
            box-shadow: 3px 3px 0 #1a1a1a;
            line-height: 1.2;
            max-width: 50%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Play Button — loud */
        .play-btn {
            background: #ff6b6b;
            border: 4px solid #1a1a1a;
            padding: 10px 20px;
            border-radius: 0;
            font-weight: 800;
            font-size: 15px;
            color: #1a1a1a;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 6px 6px 0 #1a1a1a;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .play-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0 #1a1a1a;
        }

        .play-btn svg {
            width: 18px;
            height: 18px;
            fill: #1a1a1a;
        }

        /* Loading Overlay — raw */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: #f5f0e8f0;
            backdrop-filter: blur(12px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border: 8px solid #1a1a1a;
        }

        .loading-overlay.show {
            display: flex;
        }

        .film-spinner {
            width: 90px;
            height: 90px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%231a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M8 4v16"/><path d="M16 4v16"/><path d="M2 8h4"/><path d="M2 12h4"/><path d="M2 16h4"/><path d="M18 8h4"/><path d="M18 12h4"/><path d="M18 16h4"/></svg>') no-repeat center;
            background-size: contain;
            animation: spinReel 0.9s infinite cubic-bezier(0.5, 0, 0.5, 1);
            filter: drop-shadow(6px 6px 0 #1a1a1a);
        }

        @keyframes spinReel {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #1a1a1a;
            margin-top: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            background: #ffd93d;
            padding: 10px 28px;

        /* Ad Status */
        .ad-status {

            margin-top: 20px;

            box-shadow: 5px 5px 0 #1a1a1a;
            display: none;
            text-transform: uppercase;

        }

        .ad-status.show {
            display: block;
        }

        /* Scrollbar — chunky */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #f5f0e8;
            border: 2px solid #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #ff6b6b;
            border: 2px solid #1a1a1a;
        }

        /* Extra: different site vibes via data attribute (cosmetic) */
        .app-container[data-theme="1"] { background: #fefcf5; }
        .app-container[data-theme="2"] { background: #e8f4f8; }
        .app-container[data-theme="3"] { background: #f8f0e8; }
        .app-container[data-theme="4"] { background: #f0e8f8; }
    </style>
</head>

<body>

<div class="app-container" data-theme="1">

    <!-- Loading -->

        <div class="film-spinner"></div>

    <!-- Main Content -->
    <div id="mainContent">

            <h1>🎬 প্রিমিয়াম ভিডিও হাব</h1>

            <p>

            </p>

        </div>


        <div class="video-grid" id="videoGrid"></div>


        <div class="ad-status" id="adStatus">
            🔥 বিজ্ঞাপনটি সম্পন্ন হয়েছে। আবার ক্লিক করুন।
        </div>

    </div>

</div>


<script>

    /* =====================================================
       CONFIGURATION
    ===================================================== */

    const ADSGRAM_BLOCK_ID = "int-32886";


    const REDIRECT_LINKS = [

        "https://omg10.com/4/9722283",

        "https://omg10.com/4/9809279",

        "https://omg10.com/4/9809283"

    ];


    /* Redirect delay নেই।
       কারণ Ad শেষ হওয়ার পরে দ্বিতীয় click-এই redirect হবে।
    */


    /* =====================================================
       IMAGE LIST
    ===================================================== */

    const imageUrls = [

        "https://i.ibb.co.com/bRrgh9mD/IMG-20260822-221556-525.jpg",

        "https://i.ibb.co.com/3yJ9FYGL/IMG-20260822-221555-428.jpg",

        "https://i.ibb.co.com/BKZtNjN4/IMG-20260822-221554-429.jpg",

        "https://i.ibb.co.com/5xwYHGZf/IMG-20260822-221553-168.jpg",

        "https://i.ibb.co.com/hRT6G2g7/IMG-20260822-221551-005.jpg",

        "https://i.ibb.co.com/tMZ5xyL8/IMG-20260822-221548-616.jpg",

        "https://i.ibb.co.com/MxB3KRtW/IMG-20260822-221547-774.jpg",

        "https://i.ibb.co.com/hRDDWsfm/IMG-20260822-221546-925.jpg",

        "https://i.ibb.co.com/S43YwKzs/IMG-20260822-221544-925.jpg",

        "https://i.ibb.co.com/7dVjKHsq/IMG-20260822-221529-119.jpg",

        "https://i.ibb.co.com/21zXGV87/IMG-20260822-221527-824.jpg",

        "https://i.ibb.co.com/j96DYscF/IMG-20260822-221526-366.jpg",

        "https://i.ibb.co.com/1Jm81ybR/IMG-20260822-221524-729.jpg",

        "https://i.ibb.co.com/jvq57d9p/IMG-20260822-221455-554.jpg",

        "https://i.ibb.co.com/cX7BVL22/IMG-20260822-221445-158.jpg",

        "https://i.ibb.co.com/Y739DsXm/IMG-20260822-221444-320.jpg",

        "https://i.ibb.co.com/k2qJVjnV/IMG-20260822-221443-140.jpg",

        "https://i.ibb.co.com/fz1HNPF0/IMG-20260822-221442-522.jpg",

        "https://i.ibb.co.com/rKRhg88Z/IMG-20260822-221440-971.jpg",

        "https://i.ibb.co.com/VWJbRQ6M/IMG-20260822-221440-190.jpg",

        "https://i.ibb.co.com/3mM3ntKh/IMG-20260822-221435-521.jpg",

        "https://i.ibb.co.com/DPmCZLWH/IMG-20260822-221434-264.jpg",

        "https://i.ibb.co.com/zVWFsgbt/IMG-20260822-221433-098.jpg",

        "https://i.ibb.co.com/rKZfQYdV/IMG-20260822-221431-813.jpg",

        "https://i.ibb.co.com/YF32czR6/IMG-20260822-221430-955.jpg",

        "https://i.ibb.co.com/Gf78HQSn/IMG-20260822-221428-982.jpg",

        "https://i.ibb.co.com/Dfv9sF1p/IMG-20260822-221427-181.jpg"

    ];


    /* =====================================================
       VARIABLES
    ===================================================== */

    const uniqueImages = [
        ...new Set(imageUrls)
    ];


    const loadingOverlay =
        document.getElementById("loadingOverlay");


    const videoGrid =
        document.getElementById("videoGrid");


    const adStatus =
        document.getElementById("adStatus");


    let linkIndex = 0;


    let isProcessing = false;


    /*
       false = প্রথম click এখনো হয়নি
       true  = Ad সম্পন্ন হয়েছে,
               এখন দ্বিতীয় click-এ redirect হবে
    */

    let adCompleted = false;



    /* =====================================================
       ADSGRAM FUNCTION
    ===================================================== */

    function showAdsgramAd() {

        return new Promise((resolve) => {

            /*
               Adsgram SDK আছে কিনা check
            */

            if (
                typeof window.Adsgram === "undefined" ||
                typeof window.Adsgram.init !== "function"
            ) {

                console.error(
                    "❌ Adsgram SDK পাওয়া যায়নি!"
                );

                resolve(false);

                return;
            }


            try {

                /*
                   Block ID দিয়ে controller তৈরি
                */

                const AdController =
                    window.Adsgram.init({

                        blockId:
                            ADSGRAM_BLOCK_ID

                    });


                /*
                   Ad Show
                */

                AdController.show()

                    .then(() => {

                        console.log(
                            "✅ Adsgram Ad সম্পূর্ণ হয়েছে"
                        );


                        /*
                           Ad সম্পূর্ণ হয়েছে
                        */

                        adCompleted = true;


                        /*
                           Status message
                        */

                        adStatus.classList.add("show");


                        resolve(true);

                    })


                    .catch((error) => {

                        console.error(
                            "❌ Adsgram Ad Error:",
                            error
                        );


                        /*
                           Ad না দেখালে
                           redirect করা হবে না
                        */

                        resolve(false);

                    });


            } catch (error) {

                console.error(
                    "❌ Adsgram Init Error:",
                    error
                );


                resolve(false);

            }

        });

    }



    /* =====================================================
       VIDEO CLICK HANDLER
    ===================================================== */

    async function handleVideoClick(event) {

        /*
           Card এবং button click একসাথে trigger
           হওয়া বন্ধ করবে
        */

        if (event) {

            event.preventDefault();

            event.stopPropagation();

        }


        /*
           একই সময়ে একাধিক click আটকানো
        */

        if (isProcessing) {

            return;

        }


        isProcessing = true;



        /* =================================================
           FIRST CLICK
           Ads Show
        ================================================= */

        if (!adCompleted) {

            console.log(
                "👉 First click: Adsgram Ad দেখানো হচ্ছে..."
            );


            loadingOverlay.classList.add("show");


            const adResult =
                await showAdsgramAd();


            loadingOverlay.classList.remove("show");


            isProcessing = false;


            /*
               Ad সফলভাবে সম্পূর্ণ না হলে
               এখানেই থামবে
            */

            if (!adResult) {

                console.log(
                    "⚠️ Ad সম্পূর্ণ হয়নি। আবার চেষ্টা করুন।"
                );

                return;

            }


            /*
               Ad সম্পূর্ণ হয়েছে।
               এখন আবার click করতে হবে।
            */

            return;

        }



        /* =================================================
           SECOND CLICK
           REDIRECT
        ================================================= */

        console.log(
            "👉 Second click: Redirect হচ্ছে..."
        );


        const currentLink =
            REDIRECT_LINKS[
                linkIndex %
                REDIRECT_LINKS.length
            ];


        linkIndex++;


        console.log(
            "➡️ Redirect URL:",
            currentLink
        );


        /*
           Redirect
        */

        window.location.href =
            currentLink;


    }



    /* =====================================================
       BUILD VIDEO GALLERY
    ===================================================== */

    function buildGallery() {

        if (!videoGrid) {

            return;

        }


        videoGrid.innerHTML = "";


        uniqueImages.forEach(
            (imgUrl, index) => {


                /* ===============================
                   CARD
                =============================== */

                const card =
                    document.createElement("div");


                card.className =
                    "video-card";



                /* ===============================
                   THUMBNAIL
                =============================== */

                const thumbWrapper =
                    document.createElement("div");


                thumbWrapper.className =
                    "thumbnail-wrapper";



                /* ===============================
                   IMAGE
                =============================== */

                const img =
                    document.createElement("img");


                img.src =
                    imgUrl;


                img.alt =
                    `Video ${index + 1}`;


                img.loading =
                    "lazy";


                /*
                   Image load error
                */

                img.onerror =
                    function() {

                        this.src =
                            "https://placehold.co/600x400/1e1a2e/ff88aa?text=Image+Not+Found";

                    };



                /* ===============================
                   PLAY OVERLAY
                =============================== */

                const playOverlay =
                    document.createElement("div");


                playOverlay.className =
                    "play-icon-overlay";


                playOverlay.innerHTML = `

                    <svg
                        viewBox="0 0 24 24"
                        fill="white"
                        stroke="white"
                        stroke-width="1"
                    >

                        <circle
                            cx="12"
                            cy="12"
                            r="10"
                            fill="rgba(0,0,0,0.5)"
                            stroke="white"
                            stroke-width="1.5"
                        />

                        <polygon
                            points="10,8 16,12 10,16"
                            fill="white"
                        />

                    </svg>

                `;



                thumbWrapper.appendChild(img);

                thumbWrapper.appendChild(
                    playOverlay
                );


                card.appendChild(
                    thumbWrapper
                );



                /* ===============================
                   FOOTER
                =============================== */

                const footer =
                    document.createElement("div");


                footer.className =
                    "video-card-footer";



                /* ===============================
                   TITLE
                =============================== */

                const title =
                    document.createElement("span");


                title.className =
                    "video-title";


                title.textContent =
                    `🎬 ভিডিও ${index + 1}`;



                /* ===============================
                   PLAY BUTTON
                =============================== */

                const playBtn =
                    document.createElement("button");


                playBtn.className =
                    "play-btn";


                playBtn.type =
                    "button";


                playBtn.innerHTML = `

                    <svg viewBox="0 0 24 24">

                        <polygon
                            points="5,3 19,12 5,21"
                            fill="white"
                        />

                    </svg>

                    প্লে ভিডিও

                `;



                footer.appendChild(title);

                footer.appendChild(playBtn);


                card.appendChild(footer);



                /* ===============================
                   CLICK EVENT
                =============================== */

                /*
                   Card-এর যেকোনো জায়গায় click
                   করলে Ads/Redirect হবে
                */

                card.addEventListener(
                    "click",
                    handleVideoClick
                );


                /*
                   Button click আলাদাভাবে
                   handle করতে হবে না।

                   কারণ card event-ই button click
                   ধরে ফেলবে।

                   তবে button-এর event propagation
                   বন্ধ করার জন্য আলাদা listener
                   ব্যবহার করা হচ্ছে।
                */

                playBtn.addEventListener(
                    "click",
                    function(event) {

                        event.preventDefault();

                        event.stopPropagation();

                        handleVideoClick(event);

                    }
                );


                /*
                   Gallery-তে card যোগ
                */

                videoGrid.appendChild(card);

            }
        );

    }



    /* =====================================================
       PAGE LOAD
    ===================================================== */

    window.addEventListener(
        "load",
        function() {

            /*
               শুধু gallery তৈরি হবে।

               এখানে কোনো Adsgram Ad
               automaticভাবে চালানো হবে না।
            */

            buildGallery();


            console.log(
                "✅ Premium Video Hub loaded"
            );

            console.log(
                "ℹ️ First click = Adsgram"
            );

            console.log(
                "ℹ️ Second click = Redirect"
            );

        }
    );



    /* =====================================================
       TELEGRAM WEB APP
    ===================================================== */

    if (
        window.Telegram &&
        window.Telegram.WebApp
    ) {

        window.Telegram.WebApp.ready();

        window.Telegram.WebApp.expand();

    }

</script>
